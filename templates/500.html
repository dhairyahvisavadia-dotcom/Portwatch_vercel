<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>500 — Internal Processing Condition | PortWatch</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23000'/%3E%3Ctext x='16' y='22' font-family='monospace' font-weight='900' font-size='14' fill='%23FF7A18' text-anchor='middle'%3EPW%3C/text%3E%3C/svg%3E">
<script>
  (function(){
    try {
      var saved = localStorage.getItem('portwatch_theme') || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', saved);
    } catch(e){}
  })();
</script>
<style>
  :root{
    --orange:#FF7A18; --orange-dark:#D85F00; --orange-deep:#9A4400;
    --white:#FFFFFF; --black:#000000;
    --line-soft: rgba(0,0,0,0.18);
    --muted: rgba(0,0,0,0.45);
    --mono: "JetBrains Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  [data-theme="dark"] {
    --white: #171923;
    --black: #f8fafc;
    --line-soft: #2d3345;
    --muted: #94a3b8;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.035) 0px, rgba(0,0,0,0.035) 1px, transparent 1px, transparent 3px),
      var(--orange);
    color:var(--black); font-family:var(--mono); min-height:100vh;
    display:flex; align-items:center; justify-content:center; padding:20px;
    transition: background-color 0.2s ease, color 0.2s ease;
  }
  [data-theme="dark"] body{
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px),
      #0b0d13;
    color:#f8fafc;
  }
  .card{
    background:var(--white); border:3px solid var(--black); border-radius:18px;
    box-shadow:0 8px 0 var(--black); max-width:480px; width:100%; padding:32px 28px;
    text-align:center;
  }
  [data-theme="dark"] .card{
    background:#151720; border-color:#2b3040; box-shadow:0 8px 0 #050608;
  }
  .mark{
    width:48px; height:48px; border-radius:10px; background:var(--black);
    display:inline-flex; align-items:center; justify-content:center;
    font-weight:700; color:var(--orange); font-size:16px; margin-bottom:16px;
  }
  [data-theme="dark"] .mark{
    background:var(--orange); color:#000000;
  }
  .code{
    font-size:42px; font-weight:900; letter-spacing:-0.03em; line-height:1;
    color:#B00020; margin-bottom:6px;
  }
  h1{
    font-size:16px; text-transform:uppercase; letter-spacing:.05em; margin-bottom:10px;
  }
  p{
    font-size:12px; color:var(--muted); line-height:1.5; margin-bottom:24px;
  }
  .diag{
    background:rgba(0,0,0,0.04); border:1px solid var(--line-soft); border-radius:8px;
    padding:10px 14px; font-size:11px; color:var(--muted); margin-bottom:24px; text-align:left;
  }
  [data-theme="dark"] .diag{
    background:#0f1016; border-color:#2b3040;
  }
  .actions{
    display:flex; gap:10px; justify-content:center; flex-wrap:wrap;
  }
  .fbtn{
    appearance:none; border:none; cursor:pointer; text-decoration:none;
    display:inline-flex; align-items:center; gap:6px;
    background:var(--orange); color:var(--black); font-family:var(--mono);
    font-weight:700; font-size:11.5px; text-transform:uppercase; letter-spacing:.06em;
    padding:10px 18px; border-radius:10px; border:2px solid var(--black);
    box-shadow:0 4px 0 var(--black); transition:transform .08s ease, box-shadow .08s ease;
  }
  .fbtn:hover{ background:#FF8C33; }
  .fbtn:active{ transform:translateY(4px); box-shadow:0 0 0 var(--black); }
  .fbtn.ghost{ background:var(--white); color:var(--black); }
  [data-theme="dark"] .fbtn.ghost{ background:#232635; color:#e2e8f0; border-color:#33394a; }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">PW</div>
    <div class="code">500</div>
    <h1>Internal Processing Error</h1>
    <p>An unexpected condition occurred during command or packet processing. The scanner remains safely isolated.</p>
    <div class="diag">
      <div><b>DIAGNOSTIC:</b> HTTP 500 Internal Server Error</div>
      <div><b>STATUS:</b> Safety circuit triggered</div>
      <div><b>RECOVERY:</b> Return to dashboard or trigger manual rescan.</div>
    </div>
    <div class="actions">
      <a class="fbtn" href="{{ url_for('dashboard') }}">Live Dashboard &rarr;</a>
      <a class="fbtn ghost" href="{{ url_for('landing') }}">Home</a>
    </div>
  </div>
</body>
</html>
