{% extends "base.html" %}
{% block title %}PortWatch — Change password{% endblock %}
{% block bezel_action %}
<a class="fbtn ghost" href="{{ url_for('dashboard') }}">Back</a>
{% endblock %}

{% block content %}
<div class="panel" style="max-width:420px; margin:0 auto;">
  <h2>Change password</h2>
  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label style="display:block; font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:700; margin-bottom:6px;">Current password</label>
    <input type="password" name="current_password" required style="width:100%; font-family:var(--mono); font-size:13px; padding:10px 12px; border:2px solid var(--black); border-radius:8px; margin-bottom:14px;">

    <label style="display:block; font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:700; margin-bottom:6px;">New password</label>
    <input type="password" name="new_password" required style="width:100%; font-family:var(--mono); font-size:13px; padding:10px 12px; border:2px solid var(--black); border-radius:8px; margin-bottom:14px;">

    <label style="display:block; font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:700; margin-bottom:6px;">Confirm new password</label>
    <input type="password" name="confirm_password" required style="width:100%; font-family:var(--mono); font-size:13px; padding:10px 12px; border:2px solid var(--black); border-radius:8px; margin-bottom:14px;">

    <button class="fbtn" type="submit">Update password</button>
  </form>
  {% if error %}<div style="margin-top:14px; font-size:11px; color:#B00020; background:rgba(176,0,32,0.08); border:1px solid rgba(176,0,32,0.35); border-radius:8px; padding:9px 11px;">{{ error }}</div>{% endif %}
  {% if success %}<div style="margin-top:14px; font-size:11px; color:#0A7A2E; background:rgba(10,122,46,0.08); border:1px solid rgba(10,122,46,0.35); border-radius:8px; padding:9px 11px;">{{ success }}</div>{% endif %}
</div>
{% endblock %}
